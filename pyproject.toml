[project]
name = "hlcv-project-gans"
version = "0.1.0"
description = "Synthetic-to-real image translation experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2",
    "pillow>=10,<13",
    "torch>=2.2,<2.3",
    "torchmetrics[image]>=1.9,<2",
    "torchvision>=0.17,<0.18",
    "wandb>=0.28,<0.29",
]

[project.optional-dependencies]
turbo = [
    "accelerate==0.25.0",
    "diffusers==0.25.1",
    "huggingface-hub==0.25.2",
    "lpips==0.1.4",
    "peft==0.7.1",
    "setuptools==69.5.1",
    "transformers==4.35.2",
    "vision-aided-loss==0.1.0",
    "xformers==0.0.25.post1",
]
